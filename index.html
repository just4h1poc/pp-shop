<!doctype html>
<meta charset="utf-8">
<title>Demo Shop — checkout</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 36px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  label { display: block; margin: 14px 0 4px; font-size: 14px; color: #333; }
  .field { border: 1px solid #888; border-radius: 4px; height: 42px; padding: 0 8px; }
  button { margin-top: 18px; padding: 10px 16px; font-size: 15px; cursor: pointer; }
  pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; word-break: break-all; }
  .cfg { background:#fffbe6; border:1px solid #e8d48b; padding:12px; border-radius:6px; font-size:14px; }
  .cfg input { width: 100%; box-sizing: border-box; padding: 6px; font-family: monospace; }
</style>

<h1>Demo Shop</h1>
<p>Researcher owned merchant integration. Loads the official PayPal JS SDK from
<code>www.paypal.com</code> with <code>components=hosted-fields</code>, exactly as PayPal documents.</p>

<div class="cfg">
  <strong>Merchant setup</strong> (nothing is stored; pass as query params or fill in)
  <label for="cid">Sandbox client ID</label><input id="cid" autocomplete="off">
  <label for="oid">This merchant's own order ID</label><input id="oid" autocomplete="off">
  <button id="load">Load PayPal Hosted Fields</button>
</div>

<div id="checkout" hidden>
  <label>Card number</label><div id="number" class="field"></div>
  <label>Expiration (MM/YY)</label><div id="expirationDate" class="field"></div>
  <label>CVV</label><div id="cvv" class="field"></div>
  <button id="pay">Pay</button>
</div>

<pre id="status">Waiting for merchant setup.</pre>

<script>
const q = new URLSearchParams(location.search);
const status = document.getElementById('status');
const log = (m) => { status.textContent += '\n' + m; };
document.getElementById('cid').value = q.get('client-id') || '';
document.getElementById('oid').value = q.get('order-id') || '';

document.getElementById('load').addEventListener('click', () => {
  const cid = document.getElementById('cid').value.trim();
  if (!cid) { status.textContent = 'A sandbox client ID is required.'; return; }
  status.textContent = 'Loading https://www.paypal.com/sdk/js ...';
  const s = document.createElement('script');
  s.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(cid) +
          '&components=hosted-fields&currency=USD&intent=capture';
  s.setAttribute('data-client-token', q.get('client-token') || '');
  s.onload = boot;
  s.onerror = () => log('SDK failed to load. Check the client ID.');
  document.head.appendChild(s);
});

function boot() {
  log('SDK loaded. HostedFields eligible: ' + (window.paypal && paypal.HostedFields
      ? paypal.HostedFields.isEligible() : 'no HostedFields in SDK'));
  if (!window.paypal || !paypal.HostedFields || !paypal.HostedFields.isEligible()) {
    log('This sandbox account needs Advanced Credit and Debit Card Payments enabled.');
    return;
  }
  document.getElementById('checkout').hidden = false;
  paypal.HostedFields.render({
    createOrder: () => document.getElementById('oid').value.trim(),
    styles: { input: { 'font-size': '16px' } },
    fields: {
      number:         { selector: '#number',         placeholder: '4005 5192 0000 0004' },
      expirationDate: { selector: '#expirationDate', placeholder: 'MM/YY' },
      cvv:            { selector: '#cvv',            placeholder: '123' }
    }
  }).then((hf) => {
    log('Hosted Fields rendered. The card inputs above are PayPal iframes.');
    document.getElementById('pay').addEventListener('click', () => {
      log('submitting...');
      hf.submit({ contingencies: ['3D_SECURE'] })
        .then((r) => log('submit resolved: ' + JSON.stringify(r)))
        .catch((e) => log('submit rejected: ' + (e && e.message)));
    });
  }).catch((e) => log('render failed: ' + (e && e.message)));
}
</script>
